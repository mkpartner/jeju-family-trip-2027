<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#173d36">
  <title>우리 가족 제주</title>
  <style>
    :root { --ink:#173d36; --paper:#f5f1e8; --white:#fffdf8; --coral:#ef6a4c; --muted:#6f746f; --line:rgba(23,61,54,.18); font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color:var(--ink); background:var(--paper); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:radial-gradient(circle at 10% 20%, rgba(241,201,90,.22), transparent 26rem), var(--paper); line-height:1.6; }
    .gate { width:min(100%, 400px); padding:32px 28px; border-radius:28px; background:var(--white); box-shadow:0 24px 60px rgba(16,47,42,.12); border:1px solid var(--line); }
    .mark { display:grid; width:52px; height:52px; place-items:center; border-radius:50%; background:var(--ink); color:#fff; font-family:Georgia,serif; font-size:1.5rem; }
    h1 { margin:18px 0 4px; font-size:1.5rem; letter-spacing:-.02em; }
    p { margin:0; color:var(--muted); font-size:.95rem; }
    form { display:grid; gap:14px; margin-top:24px; }
    label { display:grid; gap:6px; font-weight:700; font-size:.95rem; }
    input { width:100%; min-height:52px; padding:12px 16px; border:1px solid var(--line); border-radius:14px; background:#fff; color:var(--ink); font:inherit; font-size:1.05rem; }
    input:focus { outline:3px solid rgba(239,106,76,.35); border-color:var(--coral); }
    button { min-height:54px; border:0; border-radius:999px; background:var(--ink); color:#fff; font:inherit; font-size:1.05rem; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:progress; }
    .msg { min-height:1.5em; color:#b3412a; font-size:.92rem; font-weight:600; }
    .hint { margin-top:6px; font-size:.84rem; }
    .opening { display:none; margin-top:20px; font-weight:700; color:var(--ink); }
    body.is-opening form { display:none; }
    body.is-opening .opening { display:block; }
  </style>
</head>
<body>
  <main class="gate">
    <div class="mark" aria-hidden="true">濟</div>
    <h1>우리 가족 제주</h1>
    <p>가족에게만 공유하는 여행 준비 페이지입니다.</p>
    <p class="opening" id="opening" role="status">페이지를 여는 중입니다…</p>
    <form id="gate-form" autocomplete="on">
      <label>이름
        <input id="gate-name" name="nickname" type="text" maxlength="20" autocomplete="nickname" placeholder="예: 큰딸, 할머니" required>
      </label>
      <label>비밀번호
        <input id="gate-pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      </label>
      <p class="msg" id="gate-msg" role="alert"></p>
      <button id="gate-submit" type="submit">입장하기</button>
      <p class="hint">의견과 좋아요는 여기 적은 이름으로 남습니다. 이 기기에서는 다음부터 자동으로 열립니다.</p>
    </form>
  </main>

    function decrypt(raw) {
      return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
        .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data)); })
        .then(function (plain) { return new TextDecoder().decode(plain); });
    }

    // 입장 화면 문서를 다 읽은 뒤에 본문으로 바꿔야 두 문서가 섞이지 않는다.
    function show(html) {
      function swap() {
        document.open();
        document.write(html);
        document.close();
      }
      if (document.readyState === "complete") swap();
      else window.addEventListener("load", swap, { once: true });
    }

    function openForm(text) {
      document.body.classList.remove("is-opening");
      nameInput.value = get(NAME);
      msg.textContent = text || "";
      (nameInput.value ? pwInput : nameInput).focus();
    }

    if (!window.crypto || !crypto.subtle) {
      msg.textContent = "이 브라우저에서는 열 수 없습니다. 최신 크롬·사파리·삼성 인터넷으로 열어 주세요.";
      submit.disabled = true;
      return;
    }

    var savedKey = get(KEY), savedName = get(NAME);
    if (savedKey && savedName) {
      document.body.classList.add("is-opening");
      decrypt(bytes(savedKey)).then(show, function () {
        set(KEY, null);
        openForm("비밀번호가 바뀌었습니다. 새 비밀번호로 다시 입장해 주세요.");
      });
    } else {
      openForm("");
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var name = nameInput.value.trim().slice(0, 20);
      if (!name) { msg.textContent = "이름을 적어 주세요."; nameInput.focus(); return; }
      if (!pwInput.value) { msg.textContent = "비밀번호를 적어 주세요."; pwInput.focus(); return; }
      submit.disabled = true;
      msg.textContent = "";
      submit.textContent = "확인하는 중…";
      var raw;
      derive(pwInput.value).then(function (r) { raw = r; return decrypt(raw); }).then(function (html) {
        set(KEY, b64(raw));
        set(NAME, name);
        show(html);
      }, function () {
        submit.disabled = false;
        submit.textContent = "입장하기";
        msg.textContent = "비밀번호가 맞지 않습니다.";
        pwInput.select();
      });
    });
  })();
  </script>
</body>
</html>
